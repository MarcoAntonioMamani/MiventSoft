  <rect width="1000" height="1000" fill="url(#puntos)"/>
  <rect width="1000" height="1000" fill="url(#luz)"/>
  <rect width="1000" height="1000" fill="url(#luz2)"/>
  <circle cx="540" cy="390" r="330" fill="none" stroke="#60a5fa" stroke-opacity=".09" stroke-width="1.5"/>
