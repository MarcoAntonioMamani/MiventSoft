<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" font-family="Segoe UI, Roboto, Arial, sans-serif">
  <!-- Fondo del login de Sanbit: mostrador de punto de venta (ilustracion propia, sin dependencias) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1736"/><stop offset=".55" stop-color="#0a1430"/><stop offset="1" stop-color="#132f6c"/>
    </linearGradient>
    <radialGradient id="luz" cx="540" cy="380" r="470" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563eb" stop-opacity=".6"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="luz2" cx="170" cy="700" r="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f59e0b" stop-opacity=".16"/><stop offset="1" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <pattern id="puntos" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#93c5fd" fill-opacity=".14"/></pattern>
    <linearGradient id="mostrador" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b3a85"/><stop offset="1" stop-color="#0a1430" stop-opacity="0"/>
